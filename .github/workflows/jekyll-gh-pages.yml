name: Legacy Jekyll deployment (disabled)

# This repository is built and deployed by the Vite workflow in static.yml.
# The legacy Jekyll workflow is intentionally disabled to prevent competing Pages deployments.
on:
  push:
    branches: ["__legacy_jekyll_disabled__"]

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy Jekyll deployment is disabled. Use the Vite deployment workflow instead."
