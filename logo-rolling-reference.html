<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMBER - Rolling Logo Only</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ===== AMBER ROLLING INTRO ===== */
        .amber-intro {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            padding: 58px 20px 42px;
            background: #ffffff;
            text-align: center;
            overflow: hidden;
        }
        .amber-intro-label {
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(15px, 2.2vw, 21px);
            font-weight: 400;
            color: #171717;
            margin-bottom: 12px;
            letter-spacing: -0.4px;
        }
        .amber-rolling-window {
            width: 100%;
            min-height: 1.35em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .amber-rolling-text {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(22px, 4.5vw, 42px);
            line-height: 1.2;
            font-weight: 400;
            letter-spacing: -1px;
            color: #080808;
            white-space: nowrap;
            transform: translateY(0);
            opacity: 1;
            transition:
                transform 0.45s cubic-bezier(.22,.61,.36,1),
                opacity 0.35s ease;
        }
        .amber-rolling-text.is-exiting {
            transform: translateY(-100%);
            opacity: 0;
        }
        .amber-rolling-text.is-entering {
            transform: translateY(100%);
            opacity: 0;
        }
        .amber-neon-dot {
            color: #ff6500;
            text-shadow:
                0 0 2px #ff6500,
                0 0 7px rgba(255,101,0,.65),
                0 0 15px rgba(255,101,0,.3);
        }
        @media (max-width: 480px) {
            .amber-intro {
                padding: 44px 12px 32px;
            }
            .amber-rolling-text {
                font-size: clamp(18px, 5.8vw, 26px);
                letter-spacing: -0.6px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .amber-rolling-text {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <!-- AMBER ROLLING INTRO / LOGO SECTION -->
    <section class="amber-intro">
        <div class="amber-intro-label">We make a...</div>
        <div class="amber-rolling-window" aria-live="off">
            <div class="amber-rolling-text" id="amberRollingText">
                Branding<span class="amber-neon-dot">.</span>
            </div>
        </div>
    </section>

    <script>
        // ===== ROLLING TEXT ANIMATION =====
        (function () {
            const text = document.getElementById("amberRollingText");
            if (!text || text.dataset.initialized) return;
            text.dataset.initialized = "true";
            const words = [
                "Branding",
                "Events Organizer",
                "Events Planner",
                "Exhibitions",
                "Meetings Incentives, Conferences"
            ];
            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;
            let index = 0;
            let timer;
            function showNext() {
                text.classList.add("is-exiting");
                setTimeout(function () {
                    index = (index + 1) % words.length;
                    text.innerHTML =
                        words[index] + '<span class="amber-neon-dot">.</span>';
                    text.classList.remove("is-exiting");
                    text.classList.add("is-entering");
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            text.classList.remove("is-entering");
                        });
                    });
                }, reducedMotion ? 0 : 400);
            }
            if (!reducedMotion) {
                timer = window.setInterval(showNext, 2000);
            }
        })();
    </script>

</body>
</html>
